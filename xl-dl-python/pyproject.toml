[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xunlei-open-dlsdk"
version = "1.0.0"
description = "迅雷 XL Download Python SDK"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Xunlei" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xl_dl = ["py.typed"]
