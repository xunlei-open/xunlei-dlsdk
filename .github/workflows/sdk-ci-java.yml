name: SDK CI - Java

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sdk-ci-java.yml"
      - "xl-dl-java/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/sdk-ci-java.yml"
      - "xl-dl-java/**"
  workflow_dispatch:

env:
  XL_DL_TEST_TIMEOUT_SECONDS: "900"
  XL_DL_TEST_URL: ${{ vars.XL_DL_TEST_URL }}

jobs:
  java-desktop:
    name: Java Desktop (${{ matrix.native_id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native_id: linux-x64
            build_example: true
          - os: macos-latest
            native_id: macos-universal
            build_example: true
          - os: windows-latest
            native_id: windows-x64
            build_example: true
          - os: windows-latest
            native_id: windows-x86
            build_example: false
    defaults:
      run:
        working-directory: xl-dl-java
    env:
      APP_ID: ${{ secrets.APP_ID }}
      API_KEY: ${{ secrets.API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - run: chmod +x gradlew
        shell: bash
      - name: Build SDK and native package
        shell: bash
        run: ./gradlew :desktop:build :native:${{ matrix.native_id }}:build
      - name: Prepare Java native runtime
        if: matrix.build_example
        shell: bash
        run: |
          runtime_dir="$GITHUB_WORKSPACE/java-native-runtime/${{ matrix.native_id }}"
          native_resources_dir="native/${{ matrix.native_id }}/build/resources/main/META-INF/xunlei/open/dlsdk/native/${{ matrix.native_id }}"
          mkdir -p "$runtime_dir"
          cp "$native_resources_dir"/* "$runtime_dir/"
      - name: Run SDK integration test
        if: ${{ matrix.build_example && env.APP_ID != '' && env.API_KEY != '' }}
        shell: bash
        run: ./gradlew :desktop:integrationTest -Dcom.xunlei.open.dlsdk.native.dir="$GITHUB_WORKSPACE/java-native-runtime/${{ matrix.native_id }}"
      - name: Publish SDK and native package locally
        if: matrix.build_example
        shell: bash
        run: ./gradlew :desktop:publishToMavenLocal :native:${{ matrix.native_id }}:publishToMavenLocal
      - name: Build desktop example
        if: matrix.build_example
        shell: bash
        run: |
          chmod +x examples/desktop/gradlew
          cd examples/desktop
          ./gradlew build

  java-android:
    name: Java Android
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: xl-dl-java
    env:
      APP_ID: ${{ secrets.APP_ID }}
      API_KEY: ${{ secrets.API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew examples/android/gradlew
      - name: Build Android AAR
        shell: bash
        run: ./gradlew :android:assembleRelease :android:publishToMavenLocal
      - name: Verify AAR native libraries
        shell: bash
        run: |
          set -euo pipefail
          aar="android/build/outputs/aar/android-release.aar"
          unzip -l "$aar" | grep -E 'jni/arm64-v8a/libdk\.so$'
          unzip -l "$aar" | grep -E 'jni/arm64-v8a/libjni_dk\.so$'
          tmp="$(mktemp -d)"
          unzip -qo "$aar" "jni/arm64-v8a/libjni_dk.so" -d "$tmp"
          if command -v llvm-nm >/dev/null 2>&1; then
            nm_bin=llvm-nm
          else
            nm_bin=nm
          fi
          "$nm_bin" -D "$tmp/jni/arm64-v8a/libjni_dk.so" | grep -E 'Java_com_xunlei_open_dlsdk_XLDownloadAPI_init$'
      - name: Build Android example
        shell: bash
        run: |
          cd examples/android
          ./gradlew assembleDebug
      - name: Enable KVM
        if: ${{ env.APP_ID != '' && env.API_KEY != '' }}
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android integration test
        if: ${{ env.APP_ID != '' && env.API_KEY != '' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: xl-dl-java
          script: bash scripts/ci-android-integration.sh