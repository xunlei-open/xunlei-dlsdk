name: SDK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version used in release artifact file names"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - id: version
        name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag_name="${GITHUB_REF_NAME}"
          else
            version="${{ inputs.version }}"
            tag_name="v${version}"
          fi

          if [[ -z "${version}" ]]; then
            echo "Release version is empty." >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

  cpp-package:
    name: C++ release package
    runs-on: ubuntu-latest
    needs: release-metadata
    env:
      SDK_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Package C++ SDK
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/xunlei-dlsdk-cpp"
          mkdir -p "$package_dir"
          cp -R xl-dl-cpp/include "$package_dir/"
          cp -R xl-dl-cpp/cmake "$package_dir/"
          cp -R xl-dl-cpp/prebuilt "$package_dir/"
          cp -R xl-dl-cpp/examples "$package_dir/"
          cp xl-dl-cpp/CMakeLists.txt "$package_dir/"
          cp xl-dl-cpp/README.md "$package_dir/"
          (cd dist && zip -r "xunlei-dlsdk-cpp-${SDK_VERSION}.zip" "xunlei-dlsdk-cpp")
      - uses: actions/upload-artifact@v4
        with:
          name: cpp-release-package
          path: dist/xunlei-dlsdk-cpp-${{ env.SDK_VERSION }}.zip

  java-desktop:
    name: Java desktop JAR
    runs-on: ubuntu-latest
    needs: release-metadata
    env:
      SDK_VERSION: ${{ needs.release-metadata.outputs.version }}
    defaults:
      run:
        working-directory: xl-dl-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
        shell: bash
      - run: ./gradlew :desktop:jar
        shell: bash
      - name: Rename desktop JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../release-dist
          cp desktop/build/libs/xl-dl-desktop-*.jar "../release-dist/xl-dl-desktop-${SDK_VERSION}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: java-desktop-jar
          path: release-dist/xl-dl-desktop-${{ env.SDK_VERSION }}.jar

  java-native:
    name: Java native JAR (${{ matrix.native_id }})
    runs-on: ${{ matrix.os }}
    needs: release-metadata
    env:
      SDK_VERSION: ${{ needs.release-metadata.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native_id: linux-x64
          - os: macos-latest
            native_id: macos-universal
          - os: windows-latest
            native_id: windows-x64
          - os: windows-latest
            native_id: windows-x86
    defaults:
      run:
        working-directory: xl-dl-java
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - run: chmod +x gradlew
        shell: bash
      - run: ./gradlew :native:${{ matrix.native_id }}:jar
        shell: bash
      - name: Rename native JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../release-dist
          cp native/${{ matrix.native_id }}/build/libs/xl-dl-native-${{ matrix.native_id }}-*.jar "../release-dist/xl-dl-native-${{ matrix.native_id }}-${SDK_VERSION}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: java-native-${{ matrix.native_id }}
          path: release-dist/xl-dl-native-${{ matrix.native_id }}-${{ env.SDK_VERSION }}.jar

  java-desktop-package:
    name: Java desktop release package
    runs-on: ubuntu-latest
    needs:
      - release-metadata
      - java-desktop
      - java-native
    env:
      SDK_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: java-desktop-jar
          path: java-desktop-release
      - uses: actions/download-artifact@v4
        with:
          pattern: java-native-*
          path: java-native-release
          merge-multiple: true
      - name: Package Java Desktop SDK
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/xunlei-dlsdk-java-desktop"
          mkdir -p "$package_dir/libs" "$package_dir/docs"
          cp java-desktop-release/*.jar "$package_dir/libs/"
          cp java-native-release/*.jar "$package_dir/libs/"
          cp xl-dl-java/desktop/README.md "$package_dir/README.md"
          cp xl-dl-java/native/README.md "$package_dir/docs/native.md"
          (cd dist && zip -r "xunlei-dlsdk-java-desktop-${SDK_VERSION}.zip" "xunlei-dlsdk-java-desktop")
      - uses: actions/upload-artifact@v4
        with:
          name: java-desktop-release-package
          path: dist/xunlei-dlsdk-java-desktop-${{ env.SDK_VERSION }}.zip

  java-android:
    name: Java Android AAR
    runs-on: ubuntu-latest
    needs: release-metadata
    env:
      SDK_VERSION: ${{ needs.release-metadata.outputs.version }}
    defaults:
      run:
        working-directory: xl-dl-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
        shell: bash
      - run: ./gradlew :android:assembleRelease
        shell: bash
      - name: Rename Android AAR
        shell: bash
        run: |
          mkdir -p ../release-dist
          cp android/build/outputs/aar/android-release.aar "../release-dist/xunlei-dlsdk-java-android-${SDK_VERSION}.aar"
      - uses: actions/upload-artifact@v4
        with:
          name: java-android-aar
          path: release-dist/xunlei-dlsdk-java-android-${{ env.SDK_VERSION }}.aar

  swift-package:
    name: Swift release package
    runs-on: ubuntu-latest
    needs: release-metadata
    env:
      SDK_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Package Swift SDK
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/xunlei-dlsdk-swift"
          mkdir -p "$package_dir"
          cp -R xl-dl-swift/Sources "$package_dir/"
          cp -R xl-dl-swift/Binaries "$package_dir/"
          cp -R xl-dl-swift/Examples "$package_dir/"
          cp xl-dl-swift/Package.swift "$package_dir/"
          cp xl-dl-swift/README.md "$package_dir/"
          (cd dist && zip -r "xunlei-dlsdk-swift-${SDK_VERSION}.zip" "xunlei-dlsdk-swift")
      - uses: actions/upload-artifact@v4
        with:
          name: swift-release-package
          path: dist/xunlei-dlsdk-swift-${{ env.SDK_VERSION }}.zip

  publish-nuget:
    name: Publish NuGet packages
    runs-on: ubuntu-latest
    needs: release-metadata
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    defaults:
      run:
        working-directory: xl-dl-csharp/dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pack NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget
          common_args=(-c Release -o artifacts/nuget -p:ContinuousIntegrationBuild=true)
          dotnet pack src/Xunlei.XlDl/Xunlei.XlDl.csproj "${common_args[@]}"
          dotnet pack native/linux-x64/Xunlei.XlDl.Native.linux-x64.csproj "${common_args[@]}"
          dotnet pack native/osx-universal/Xunlei.XlDl.Native.osx-universal.csproj "${common_args[@]}"
          dotnet pack native/win-x64/Xunlei.XlDl.Native.win-x64.csproj "${common_args[@]}"
          dotnet pack native/win-x86/Xunlei.XlDl.Native.win-x86.csproj "${common_args[@]}"
      - name: Publish to nuget.org
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NUGET_API_KEY}" ]]; then
            echo "NUGET_API_KEY secret is required." >&2
            exit 1
          fi

          for package in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "${NUGET_API_KEY}" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          done

  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    needs: release-metadata
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: xl-dl-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@xunlei-open"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @xunlei-open/dlsdk typecheck
      - run: pnpm --filter @xunlei-open/dlsdk build
      - name: Publish to npm
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "NPM_TOKEN secret is required." >&2
            exit 1
          fi

          publish_if_missing() {
            local package_dir="$1"
            local package_name
            local package_version
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            package_version="$(node -p "require('./${package_dir}/package.json').version")"

            if npm view "${package_name}@${package_version}" version --registry "https://registry.npmjs.org" >/dev/null 2>&1; then
              echo "npm package ${package_name} ${package_version} already exists; skipping."
              return 0
            fi

            npm publish "./${package_dir}" --access public
          }

          publish_if_missing packages/native-windows-x64
          publish_if_missing packages/native-windows-x86
          publish_if_missing packages/native-macos-universal
          publish_if_missing packages/native-linux-x64
          publish_if_missing packages/core

  publish-pypi:
    name: Publish PyPI packages
    runs-on: ubuntu-latest
    needs: release-metadata
    defaults:
      run:
        working-directory: xl-dl-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - name: Build Python distributions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-dist
          mkdir -p .release-dist
          python -m build --outdir .release-dist .
          python -m build --outdir .release-dist native/xl_dl_python_native_windows_x64
          python -m build --outdir .release-dist native/xl_dl_python_native_windows_x86
          python -m build --outdir .release-dist native/xl_dl_python_native_macos_universal
          python -m build --outdir .release-dist native/xl_dl_python_native_linux_x64
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: xl-dl-python/.release-dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - release-metadata
      - cpp-package
      - java-desktop-package
      - java-android
      - swift-package
      - publish-nuget
      - publish-npm
      - publish-pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cpp-release-package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: java-desktop-release-package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: java-android-aar
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: swift-release-package
          path: dist
      - name: List release files
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-metadata.outputs.tag_name }}
          files: dist/*
          overwrite_files: true
