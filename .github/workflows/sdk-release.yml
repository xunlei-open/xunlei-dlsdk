name: SDK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version used in release artifact file names"
        required: true
        default: "1.0.0"

permissions:
  contents: write

env:
  SDK_VERSION: ${{ inputs.version || '1.0.0' }}

jobs:
  cpp-package:
    name: C++ release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package C++ SDK
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/xunlei-dlsdk-cpp"
          mkdir -p "$package_dir"
          cp -R xl-dl-cpp/include "$package_dir/"
          cp -R xl-dl-cpp/cmake "$package_dir/"
          cp -R xl-dl-cpp/prebuilt "$package_dir/"
          cp -R xl-dl-cpp/examples "$package_dir/"
          cp xl-dl-cpp/CMakeLists.txt "$package_dir/"
          cp xl-dl-cpp/README.md "$package_dir/"
          (cd dist && zip -r "xunlei-dlsdk-cpp-${SDK_VERSION}.zip" "xunlei-dlsdk-cpp")
      - uses: actions/upload-artifact@v4
        with:
          name: cpp-release-package
          path: dist/xunlei-dlsdk-cpp-${{ env.SDK_VERSION }}.zip

  java-desktop:
    name: Java desktop JAR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xl-dl-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
        shell: bash
      - run: ./gradlew :desktop:jar
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: java-desktop-jar
          path: xl-dl-java/desktop/build/libs/xl-dl-desktop-${{ env.SDK_VERSION }}.jar

  java-native:
    name: Java native JAR (${{ matrix.native_id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native_id: linux-x64
          - os: macos-latest
            native_id: macos-universal
          - os: windows-latest
            native_id: windows-x64
          - os: windows-latest
            native_id: windows-x86
    defaults:
      run:
        working-directory: xl-dl-java
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - run: chmod +x gradlew
        shell: bash
      - run: ./gradlew :native:${{ matrix.native_id }}:jar
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: java-native-${{ matrix.native_id }}
          path: xl-dl-java/native/${{ matrix.native_id }}/build/libs/xl-dl-native-${{ matrix.native_id }}-${{ env.SDK_VERSION }}.jar

  java-desktop-package:
    name: Java desktop release package
    runs-on: ubuntu-latest
    needs:
      - java-desktop
      - java-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: java-desktop-jar
          path: java-desktop-release
      - uses: actions/download-artifact@v4
        with:
          pattern: java-native-*
          path: java-native-release
          merge-multiple: true
      - name: Package Java Desktop SDK
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/xunlei-dlsdk-java-desktop"
          mkdir -p "$package_dir/libs" "$package_dir/docs"
          cp java-desktop-release/*.jar "$package_dir/libs/"
          cp java-native-release/*.jar "$package_dir/libs/"
          cp xl-dl-java/desktop/README.md "$package_dir/README.md"
          cp xl-dl-java/native/README.md "$package_dir/docs/native.md"
          (cd dist && zip -r "xunlei-dlsdk-java-desktop-${SDK_VERSION}.zip" "xunlei-dlsdk-java-desktop")
      - uses: actions/upload-artifact@v4
        with:
          name: java-desktop-release-package
          path: dist/xunlei-dlsdk-java-desktop-${{ env.SDK_VERSION }}.zip

  java-android:
    name: Java Android AAR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xl-dl-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
        shell: bash
      - run: ./gradlew :android:assembleRelease
        shell: bash
      - name: Rename Android AAR
        shell: bash
        run: |
          mkdir -p ../release-dist
          cp android/build/outputs/aar/android-release.aar "../release-dist/xunlei-dlsdk-java-android-${SDK_VERSION}.aar"
      - uses: actions/upload-artifact@v4
        with:
          name: java-android-aar
          path: release-dist/xunlei-dlsdk-java-android-${{ env.SDK_VERSION }}.aar

  swift-package:
    name: Swift release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Swift SDK
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/xunlei-dlsdk-swift"
          mkdir -p "$package_dir"
          cp -R xl-dl-swift/Sources "$package_dir/"
          cp -R xl-dl-swift/Binaries "$package_dir/"
          cp -R xl-dl-swift/Examples "$package_dir/"
          cp xl-dl-swift/Package.swift "$package_dir/"
          cp xl-dl-swift/README.md "$package_dir/"
          (cd dist && zip -r "xunlei-dlsdk-swift-${SDK_VERSION}.zip" "xunlei-dlsdk-swift")
      - uses: actions/upload-artifact@v4
        with:
          name: swift-release-package
          path: dist/xunlei-dlsdk-swift-${{ env.SDK_VERSION }}.zip

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - cpp-package
      - java-desktop-package
      - java-android
      - swift-package
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cpp-release-package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: java-desktop-release-package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: java-android-aar
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: swift-release-package
          path: dist
      - name: List release files
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.SDK_VERSION) }}
          files: dist/*
